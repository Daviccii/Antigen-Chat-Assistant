[phases.build]
cmds = [
    "cd frontend && npm install",
    "cd backend && pip install -r requirements.txt"
]

[start]
cmd = "cd backend && chmod +x start.sh && ./start.sh"

[variables]
PORT = "8000"
NIXPACKS_PYTHON_VERSION = "3.11"
NIXPACKS_NODE_VERSION = "18"

[providers]
  [providers.node]
    detection = ["frontend/package.json"]
    [providers.node.build]
      cmd = "cd frontend && npm install"
  [providers.python]
    detection = ["backend/requirements.txt"]
    [providers.python.build]
      cmd = "cd backend && pip install -r requirements.txt"